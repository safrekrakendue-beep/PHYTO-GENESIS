umb\">T.L.S. / ARCHIVO CENTRAL / ECOSISTEMAS</div><div class=\"sectionhead\"><h2>ECOSISTEMAS Y HÁBITATS</h2><span class=\"eyebrow\">LECTURA AMBIENTAL</span></div><div class=\"two\"><div class=\"panel\"><h3>Red ecológica</h3><ul class=\"list\"><li>Raíces y micelios pueden conectar organismos y compartir nutrientes o señales.</li><li>La fauna puede dispersar semillas y polen; su respuesta depende de la especie y el entorno.</li><li>Las zonas húmedas favorecen plantas acuáticas y colonias de superficie.</li><li>Las plantas territoriales pueden defender áreas concretas sin estar activas constantemente.</li><li>La vegetación puede alterar el terreno, crear refugios y sostener el ciclo de infección.</li></ul></div><div class=\"panel\"><h3>Mapa de referencia</h3><div class=\"mapmock\"><span>⊕ PUNTO 0<br><small>MAPA CONCEPTUAL · SIN COORDENADAS REALES</small></span></div><p style=\"color:var(--muted);font-size:11px\">Límites orientativos; no es cartografía real medida.</p><a class=\"backlink\" href=\"#route:punto-0.html\">IR AL EXPEDIENTE PUNTO 0 ↗</a></div></div><div class=\"sectionhead\"><h2>ZONAS DOCUMENTADAS</h2></div><div class=\"grid\"><article class=\"card\"><h3>Bosques y selvas</h3><p>Dosel superior, sotobosque, vegetación defensiva y redes de raíces.</p></article><article class=\"card\"><h3>Ruinas urbanas</h3><p>Enredaderas colonizadoras, estructuras artificiales y especies adaptadas al entorno urbano.</p></article><article class=\"card\"><h3>Pantanos y ríos</h3><p>Raíces en suelos fangosos, hojas flotantes y plantas acuáticas.</p></article><article class=\"card\"><h3>Zonas nocturnas</h3><p>Especies que despliegan estructuras durante la noche, incluidas variedades bioluminiscentes.</p></article><article class=\"card\"><h3>Invernaderos</h3><p>Ambientes húmedos y estables donde pueden coexistir especies exóticas no hostiles.</p></article><article class=\"card\"><h3>Zonas costeras y frías</h3><p>Variantes adaptadas a humedad, temperatura y dispersión.</p></article></d \">☣ NIVEL DE AMENAZA<br><strong>VARIABLE · ALTO EN ZONAS ACTIVAS</strong></div><div class=\"sidehead\">ESTADO DEL SISTEMA</div><p style=\"font-size:11px;color:#9fbd77\">● Índice local cargado<br>● Enlaces entre páginas activos<br><span style=\"color:#b3a16f\">△ Archivo conceptual de ficción</span></p></aside>\n<main class=\"main\"><div class=\"breadcrumb\">T.L.S. / ARCHIVO CENTRAL / CATÁLOGO DE ESPECIES</div><div class=\"sectionhead\"><h2>CATÁLOGO DE ESPECIES</h2><input id=\"search\" class=\"search\" placeholder=\"Buscar especie, tipo o comportamiento…\"></div><div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px\"><select id=\"categoryFilter\" class=\"search\"><option value=\"\">TODAS LAS CATEGORÍAS</option><option>Árbol</option><option>Arbusto</option><option>Flor</option><option>Enredadera</option><option>Carnívora</option><option>Acuática</option><option>Nocturna</option><option>Medicinal</option></select><span id=\"count\" class=\"pill\">30 REGISTROS</span></div><p style=\"color:var(--muted)\">Selecciona cualquier ficha para abrir su expediente completo.</p><div id=\"speciesGrid\" class=\"grid\"></div>\n<div id=\"modal\" class=\"modal hidden\"><div class=\"modalbox\"><button class=\"close\" id=\"close\">CERRAR ×</button><div id=\"modalContent\"></div></div></div>\n<div class=\"footer\">T.L.S. // THE LAST SURVIVORS · PHYTOGENESIS PG-01<br>BUILD 0.4 · SITIO HTML MULTIPÁGINA · ARCHIVO DE FICCIÓN</div></main></div>\n<script>const species=[\n{name:'El Cazador',type:'Árbol',classif:'Territorial / detector',desc:'Árbol de gran tamaño conectado a una red subterránea que detecta vibraciones y puede responder con raíces de ataque.',risk:'Muy alto',habitat:'Bosques, ruinas urbanas, parques y zonas con abundante materia orgánica.',height:'15–40 m',cycle:'Estado pasivo → detección de vibraciones → respuesta de raíces → neutralización de la presa → absorción de materia orgánica.',weak:'El núcleo del tronco es vital. Dañar las raíces principales puede debilitar su control; el fuego prolongado puede destruir secciones grandes, pero requiere tiempo y recursos.',role:'Control territorial, conexión ecológica y producción de estructuras reproductivas.',behavior:'Puede permanecer inmóvil durante largos periodos y responder solo cuando detecta intrusos.'},\n{name:'El Frutal',type:'Árbol',classif:'Frutal / dispersor',desc:'Árbol especializado en producir frutos atractivos que contienen semillas de la infección.',risk:'Medio a largo plazo',habitat:'Bosques, parques, jardines abandonados y ciudades cubiertas de vegetación.',height:'10–25 m',cycle:'Floración → formación y maduración del fruto → consumo por fauna → transporte de semillas → dispersión y germinación.',weak:'Los frutos pueden destruirse antes de madurar. El tronco y las raíces pueden dañarse mediante fuego o daño mecánico.',role:'Expansión de la infección a distancia y atracción de fauna dispersora.',behavior:'No suele atacar directamente; el riesgo principal es su contribución a la expansión.'},\n{name:'El Espinario',type:'Arbusto',classif:'Defensivo / carnívoro',desc:'Arbusto denso y aparentemente atractivo que combina néctar, frutos, espinas y estructuras de captura.',risk:'Alto local; muy alto en colonias',habitat:'Bosques, ruinas urbanas, caminos abandonados y zonas húmedas.',height:'1–3 m',cycle:'Atracción → acercamiento de fauna → entrada en la estructura → cierre de ramas y trampas → digestión.',weak:'El fuego destruye hojas y estructuras de captura. Daños en la base pueden comprometer el núcleo; los climas extremos reducen su actividad.',role:'Defensa territorial y obtención de nutrientes de fauna cercana.',behavior:'Puede permanecer inmóvil durante largos periodos, pareciendo un arbusto normal.'},\n{name:'El Berrero',type:'Arbusto',classif:'Frutal / dispersor',desc:'Arbusto generalmente poco agresivo que produce frutos dulces y nutritivos con semillas infecciosas.',risk:'Bajo individual; medio en grandes colonias',habitat:'Bosques, áreas abiertas, ruinas urbanas y zonas húmedas o soleadas.',height:'0,5–3 m',cycle:'Floración → fruto maduro → consumo por animales → transporte digestivo → dispersión y germinación.',weak:'Destruir los frutos reduce la dispersión. Sus raíces superficiales son vulnerables y depende de la fauna para expandirse.',role:'Dispersión de semillas y creación de nuevos focos de vegetación infectada.',behavior:'No suele capturar animales ni atacar directamente.'},\n{name:'La Bella',type:'Flor',classif:'Ornamental / atracción',desc:'Flor llamativa con pétalos grandes, colores intensos, aroma dulce y producción de néctar.',risk:'Bajo a medio',habitat:'Bosques, ruinas, parques abandonados y zonas con polinizadores.',height:'Variable; flores grandes',cycle:'Apertura floral → atracción de polinizadores → transferencia de polen → producción de semillas → dispersión.',weak:'La falta de polinizadores limita su reproducción; el fuego puede destruir flores y estructuras reproductivas.',role:'Atracción de polinizadores y dispersión de semillas mediante fauna.',behavior:'No es agresiva por sí misma según la ficha; su presencia puede indicar una zona colonizada.'},\n{name:'La Espinada',type:'Flor',classif:'Rosa defensiva / captura',desc:'Rosa de apariencia hermosa cuyos tallos y pétalos pueden convertirse en una estructura espinosa de captura.',risk:'Alto',habitat:'Ruinas, bosques y estructuras cubiertas de vegetación.',height:'No confirmada',cycle:'Estado floral → detección de presión o movimiento → cierre de ramas y espinas → atrapamiento → descomposición vegetal de la presa.',weak:'Cortar tallos puede interrumpir el cierre; el fuego destruye la estructura. Las espinas pueden seguir siendo peligrosas tras el cierre.',role:'Defensa territorial y captura de fauna.',behavior:'Puede parecer una rosa normal hasta que detecta un intruso.'},\n{name:'La Tejedora',type:'Enredadera',classif:'Colonizadora / conectiva',desc:'Enredadera de crecimiento rápido cuyos tallos se entrelazan y forman redes que conectan plantas y estructuras.',risk:'Medio',habitat:'Edificios, ruinas, puentes, torres, bosques y estructuras verticales.',height:'Puede superar 50 m',cycle:'Germinación en grietas → ascenso → colonización de superficies → conexión entre plantas → cobertura de estructuras.',weak:'El corte de tallos interrumpe la expansión; el fuego puede quemar rápidamente la superficie colonizada.',role:'Conexión ecológica, expansión territorial y soporte estructural.',behavior:'No suele atacar directamente, pero puede facilitar la expansión de otras especies.'},\n{name:'La Estranguladora',type:'Enredadera',classif:'Depredadora / captura',desc:'Enredadera especializada en detectar movimiento, enrollarse alrededor de presas e inmovilizarlas.',risk:'Alto a muy alto',habitat:'Bosques, ruinas, árboles y grandes estructuras.',height:'Variable; puede superar 50 m',cycle:'Detección → aproximación de tallos → agarre → inmovilización → absorción de nutrientes.',weak:'El corte de tallos interrumpe el movimiento y la sujeción; el fuego puede destruir sus estructuras.',role:'Captura de seres vivos y obtención de nutrientes.',behavior:'Sus tallos pueden permanecer ocultos entre la vegetación hasta detectar movimiento.'},\n{name:'La Mordiente',type:'Carnívora',classif:'Trampa activa / cierre rápido',desc:'Planta carnívora que detecta movimiento o presión y cierra sus hojas-trampa en fracciones de segundo.',risk:'Alto a muy alto',habitat:'Ruinas urbanas, bosques, puentes y zonas con fauna.',height:'1–8 m',cycle:'Detección → cierre rápido → inmovilización → digestión → absorción.',weak:'El corte de hojas interrumpe la trampa; el fuego quema rápidamente su estructura.',role:'Control de fauna y reciclaje de nutrientes orgánicos.',behavior:'Puede capturar presas grandes; el cierre es rápido y difícil de evitar.'},\n{name:'La Cántara',type:'Carnívora',classif:'Trampa pasiva / jarra',desc:'Desarrolla estructuras huecas en forma de jarra con líquido digestivo y superficies internas resbaladizas.',risk:'Medio a alto',habitat:'Bosques, ruinas, zonas húmedas y estructuras elevadas.',height:'0,5–8 m',cycle:'Atracción por néctar → entrada → caída → retención → digestión → absorción.',weak:'El corte de las jarras interrumpe la captura; el fuego destruye las estructuras.',role:'Captura de polinizadores, insectos y pequeños animales; reciclaje de nutrientes.',behavior:'No suele perseguir presas: depende de la atracción y de la trampa pasiva.'},\n{name:'El Rabo de Espinas',type:'Acuática',classif:'Defensiva / proyección',desc:'Planta acuática cuyas estructuras florales modificadas acumulan y disparan espinas vegetales endurecidas.',risk:'Medio a alto',habitat:'Pantanos, riberas, lagos, estanques y zonas inundadas.',height:'2–4 m',cycle:'Detección de movimiento → carga de la estructura → disparo de espinas → impacto → regeneración.',weak:'El corte de tallos interrumpe la proyección; el fuego destruye las estructuras florales.',role:'Defensa a distancia de colonias y zonas húmedas.',behavior:'Puede lanzar espinas en varias direcciones cuando detecta movimiento dentro de su rango.'},\n{name:'La Flotante',type:'Acuática',classif:'Colonizadora / superficie',desc:'Forma extensas colonias de hojas flotantes interconectadas; sus flores atraen polinizadores y fauna.',risk:'Bajo a medio',habitat:'Lagos, ríos lentos, estanques y áreas urbanas inundadas.',height:'Hojas de 1–3 m de diámetro',cycle:'Germinación → expansión de hojas → conexión entre plantas → floración → colonia madura.',weak:'El corte de tallos conectores interrumpe la expansión; el fuego destruye hojas y estructuras flotantes.',role:'Crea refugio, filtra nutrientes y sirve de base para otras especies acuáticas.',behavior:'La especie base no es carnívora, aunque puede facilitar la expansión de especies más peligrosas.'},\n{name:'La Imitadora',type:'Acuática',classif:'Carnívora / camuflaje',desc:'Planta acuática que imita a La Flotante; sus hojas se cierran cuando detectan peso o movimiento.',risk:'Alto',habitat:'Lagos, estanques, ríos lentos y colonias de La Flotante.',height:'Hojas de 1–3 m de diámetro',cycle:'Camuflaje → detección de presión → cierre rápido → arrastre bajo el agua → digestión.',weak:'El corte de hojas rompe el mecanismo de cierre; el fuego destruye la estructura vegetal.',role:'Captura de presas y control de fauna en zonas acuáticas.',behavior:'Puede confundirse con una flotante normal, por lo que resulta peligrosa en colonias mixtas.'},\n{name:'La Vigilante',type:'Nocturna',classif:'Carnívora / detección',desc:'Planta nocturna que detecta movimiento, calor y vibraciones mediante una estructura central similar a un ojo.',risk:'Alto',habitat:'Bosques densos, ruinas, cavernas, zonas húmedas y áreas con poca luz.',height:'1–4 m',cycle:'Estado diurno cerrado → apertura nocturna → detección → orientación → captura → digestión.',weak:'El corte de tallos limita tentáculos; el fuego destruye pétalos y estructuras de captura.',role:'Detección nocturna y control de fauna.',behavior:'Permanece cerrada durante el día y se activa al caer la noche.'},\n{name:'La Luciérnaga',type:'Nocturna',classif:'Bioluminiscente / atracción',desc:'Emite luz azul, púrpura, rosa o blanca para atraer polinizadores nocturnos.',risk:'Medio',habitat:'Bosques densos, ruinas vegetales, zonas húmedas y cavernas con vegetación.',height:'Flores de 10–50 cm de diámetro',cycle:'Estado diurno cerrado → apertura → máximo brillo nocturno → cierre antes del amanecer → descanso.',weak:'El corte de tallos interrumpe la producción floral; el fuego destruye la estructura.',role:'Atracción de polinizadores y creación de hábitats nocturnos.',behavior:'No es agresiva por sí misma; su luz puede indicar la presencia de otras plantas colonizadoras.'},\n{name:'La Sanadora',type:'Medicinal',classif:'Regeneración natural',desc:'Produce un gel vegetal ficticio asociado a la cicatrización y a la reducción de inflamación.',risk:'Variable',habitat:'Zonas húmedas, bosques densos y riberas.',height:'0,5–1,5 m',cycle:'Crecimiento → producción de gel en hojas → recolección controlada → regeneración de tejido vegetal.',weak:'La extracción excesiva puede dañar la planta; identificación incorrecta con imitadoras supone un riesgo ficticio.',role:'Recurso medicinal dentro del universo; no cura la infección vegetal.',behavior:'Su uso requiere identificación y preparación apropiadas dentro del lore.'},\n{name:'El Calmante',type:'Medicinal',classif:'Sedante natural',desc:'Produce compuestos sedantes ficticios, asociados al alivio del dolor y a la relajación.',risk:'Variable',habitat:'Zonas sombreadas, cuevas y ruinas.',height:'0,3–1,2 m',cycle:'Crecimiento → floración → producción de néctar y compuestos → recolección controlada.',weak:'El uso excesivo de sus compuestos ficticios puede provocar efectos adversos.',role:'Alivio sintomático dentro del universo, no tratamiento de la infección.',behavior:'Las dosis altas pueden ser peligrosas en la ficción; no es una cura.'},\n{name:'El Antídoto',type:'Medicinal',classif:'Desintoxicante',desc:'Contiene compuestos ficticios que pueden neutralizar determinadas toxinas vegetales, pero no eliminan la infección.',risk:'Variable',habitat:'Zonas pantanosas y áreas con plantas tóxicas.',height:'0,5–2 m',cycle:'Crecimiento → formación de filamentos → producción de compuestos → recolección controlada.',weak:'La composición puede variar; la especie no ofrece una cura universal.',role:'Reducción parcial de efectos tóxicos dentro del lore.',behavior:'Debe distinguirse de la falsa imitadora del antídoto.'},\n{name:'El Purificador',type:'Medicinal',classif:'Antimicrobiano',desc:'Produce resinas ficticias asociadas a propiedades antimicrobianas y antifúngicas.',risk:'Variable',habitat:'Zonas frías, montañas y ruinas expuestas.',height:'0,8–2,5 m',cycle:'Crecimiento → producción de resina → recolección → aplicación externa ficticia.',weak:'La resina turbia o alterada puede indicar contaminación dentro del lore; el uso excesivo puede irritar tejidos.',role:'Tratamiento ficticio de heridas y prevención de infecciones secundarias.',behavior:'No previene ni elimina la infección vegetal por sí solo.'},\n{name:'El Renovador',type:'Medicinal',classif:'Estimulante celular',desc:'Estimula la recuperación celular ficticia, pero su uso prolongado puede provocar fatiga y daños.',risk:'Variable',habitat:'Zonas abiertas, claros de bosques y colinas.',height:'0,5–2 m',cycle:'Crecimiento → floración → concentración de compuestos → recolección controlada.',weak:'El uso prolongado puede resultar perjudicial dentro del universo ficticio.',role:'Apoyo a la recuperación física en el lore.',behavior:'No es una cura; el abuso puede empeorar el estado del organismo.'},\n{name:'La Estranguladora Morada',type:'Enredadera',classif:'Variante de captura',desc:'Variante de la Estranguladora con flores grandes y colores intensos.',risk:'Alto a muy alto',habitat:'Bosques y ruinas con vegetación densa.',height:'Variable',cycle:'Detección → enrollamiento → inmovilización → absorción.',weak:'Corte de tallos y fuego.',role:'Captura y obtención de nutrientes.',behavior:'Los detalles anatómicos varían según la colonia.'},\n{name:'La Estranguladora Roja',type:'Enredadera',classif:'Variante agresiva',desc:'Variante de crecimiento rápido y espinas más densas.',risk:'Muy alto',habitat:'Ruinas, puentes y zonas de vegetación densa.',height:'Variable',cycle:'Detección → aproximación → sujeción → absorción.',weak:'Corte de tallos y fuego.',role:'Captura de presas y expansión local.',behavior:'Las espinas aumentan la capacidad de sujeción.'},\n{name:'El Rabo de Espinas Gigante',type:'Acuática',classif:'Variante de gran tamaño',desc:'Variante de mayor tamaño y capacidad de disparo que las formas comunes.',risk:'Alto',habitat:'Pantanos extensos y zonas húmedas.',height:'Puede superar 4 m',cycle:'Detección → carga → disparo → regeneración.',weak:'Corte de tallos y fuego.',role:'Defensa territorial a distancia.',behavior:'Mayor alcance y potencia de disparo que las variantes comunes.'},\n{name:'La Flotante Púrpura',type:'Acuática',classif:'Variante adaptada a sombra',desc:'Variante de tonos oscuros adaptada a zonas sombrías y aguas profundas.',risk:'Bajo a medio',habitat:'Aguas profundas y zonas húmedas con poca luz.',height:'Hojas de gran tamaño',cycle:'Germinación → expansión → conexión → floración.',weak:'Corte de tallos conectores y fuego.',role:'Colonización de superficies acuáticas.',behavior:'Los colores más oscuros la distinguen de la variante rosa.'},\n{name:'La Mordiente Gigante',type:'Carnívora',classif:'Variante de gran tamaño',desc:'Ejemplar capaz de capturar presas grandes mediante una trampa de cierre rápido.',risk:'Muy alto',habitat:'Ruinas, bosques y zonas con fauna de gran tamaño.',height:'Puede superar 8 m',cycle:'Detección → cierre → inmovilización → digestión → absorción.',weak:'Corte de hojas y fuego.',role:'Control de fauna y reciclaje de nutrientes.',behavior:'La gran fuerza de cierre la hace especialmente peligrosa.'},\n{name:'La Cántara Oscura',type:'Carnívora',classif:'Variante de sombra',desc:'Variante adaptada a zonas sombrías; presenta un aroma más fuerte y líquido digestivo más ácido.',risk:'Alto',habitat:'Bosques sombríos, ruinas y zonas húmedas.',height:'Variable',cycle:'Atracción → entrada → caída → retención → digestión.',weak:'Corte de jarras y fuego.',role:'Captura pasiva y absorción de nutrientes.',behavior:'Su líquido y su coloración pueden diferir de otras variantes.'},\n{name:'La Bella Blanca',type:'Flor',classif:'Variante ornamental',desc:'Variante de flores blancas y aroma intenso.',risk:'Bajo a medio',habitat:'Bosques, ruinas y zonas con polinizadores.',height:'Variable',cycle:'Floración → polinización → semillas → dispersión.',weak:'Falta de polinizadores y daño por fuego.',role:'Atracción de polinizadores.',behavior:'No se considera agresiva por sí misma.'},\n{name:'La Espinada Negra',type:'Flor',classif:'Variante defensiva',desc:'Variante de color oscuro y mayor resistencia, con espinas densas.',risk:'Alto',habitat:'Ruinas urbanas y zonas densamente colonizadas.',height:'No confirmada',cycle:'Estado floral → detección → cierre de ramas → atrapamiento.',weak:'Corte de tallos y fuego.',role:'Defensa territorial y captura.',behavior:'Su aspecto oscuro puede camuflarla en zonas de sombra.'},\n{name:'La Falsa Sanadora',type:'Medicinal',classif:'Imitadora peligrosa',desc:'Imita la apariencia de La Sanadora, pero sus compuestos ficticios aceleran la necrosis en vez de regenerar tejidos.',risk:'Muy alto',habitat:'Zonas con actividad humana y presencia de especies medicinales.',height:'No confirmada',cycle:'Imitación visual → atracción de recolectores → contacto o consumo → efectos adversos.',weak:'Observación detallada y comparación con referencias auténticas.',role:'No tiene función medicinal útil para los supervivientes.',behavior:'Puede presentar manchas oscuras, savia más viscosa y olor desagradable.'},\n{name:'La Falsa Calmante',type:'Medicinal',classif:'Imitadora peligrosa',desc:'Imita al Calmante, pero sus compuestos ficticios actúan como estimulantes extremos y pueden causar alucinaciones.',risk:'Muy alto',habitat:'Zonas sombreadas y áreas con presencia humana.',height:'No confirmada',cycle:'Imitación → recolección → exposición → efectos adversos.',weak:'Inspección de pétalos, olor y composición dentro del lore.',role:'Ninguna función medicinal segura.',behavior:'Puede presentar color más intenso, pétalos rígidos y aroma penetrante.'},\n{name:'La Falsa Antídoto',type:'Medicinal',classif:'Imitadora peligrosa',desc:'Imita al Antídoto, pero agrava los efectos de las toxinas y acelera síntomas de infección.',risk:'Muy alto',habitat:'Zonas pantanosas y áreas con plantas tóxicas.',height:'No confirmada',cycle:'Imitación → exposición → agravamiento de síntomas.',weak:'Identificación detallada; no confiar solo en el color.',role:'No ofrece protección real.',behavior:'Sus filamentos pueden ser más largos y desordenados; el color tiende a granate.'},\n{name:'El Falso Purificador',type:'Medicinal',classif:'Imitadora peligrosa',desc:'Imita al Purificador, pero su resina ficticia favorece hongos y provoca irritaciones.',risk:'Muy alto',habitat:'Zonas frías, ruinas y áreas húmedas.',height:'No confirmada',cycle:'Imitación → contacto con resina → irritación y proliferación fúngica.',weak:'Observación de hojas, resina y cristales internos.',role:'No es un recurso seguro.',behavior:'La resina aparece turbia y las hojas pueden mostrar bordes irregulares.'},\n{name:'El Falso Renovador',type:'Medicinal',classif:'Imitadora peligrosa',desc:'Imita al Renovador, pero acelera la degeneración celular ficticia y provoca debilidad.',risk:'Muy alto',habitat:'Claros, zonas abiertas y bosques.',height:'No confirmada',cycle:'Imitación → exposición → fatiga y deterioro progresivo.',weak:'Comparación cuidadosa de pétalos, color y olor.',role:'No aporta recuperación real.',behavior:'Puede mostrar pétalos caídos, tonos marrones y polen oscuro.'}\n];\n\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction card(s){return `<article class=\"card species\" data-category=\"${esc(s.type)}\" data-search=\"${esc((s.name+' '+s.type+' '+s.classif+' '+s.desc+' '+s.role+' '+s.habitat).toLowerCase())}\"><div class=\"tag\">PG-01 / ${esc(s.type.toUpperCase())}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><span class=\"pill ${/alto|muy alto/i.test(s.risk)?'high':''}\">RIESGO: ${esc(s.risk)}</span><br><button onclick=\"showSpecies('${esc(s.name)}')\">ABRIR FICHA ↗</button></article>`}\nfunction showSpecies(name){const s=species.find(x=>x.name===name);if(!s)return;document.getElementById('modalContent').innerHTML=`<div class=\"eyebrow\">T.L.S. / EXPEDIENTE DE ESPECIE · PG-01</div><h2>${esc(s.name)}</h2><p><b>Clasificación:</b> ${esc(s.classif)} · <b>Tipo:</b> ${esc(s.type)}</p><p>${esc(s.desc)}</p><div class=\"specgrid\"><div class=\"specbox\"><b>DIMENSIONES</b><p>${esc(s.height)}</p></div><div class=\"specbox\"><b>NIVEL DE RIESGO</b><p>${esc(s.risk)}</p></div><div class=\"specbox\"><b>HÁBITAT</b><p>${esc(s.habitat)}</p></div><div class=\"specbox\"><b>FUNCIÓN ECOLÓGICA</b><p>${esc(s.role)}</p></div><div class=\"specbox\"><b>CICLO</b><p>${esc(s.cycle)}</p></div><div class=\"specbox\"><b>DEBILIDADES</b><p>${esc(s.weak)}</p></div><div class=\"specbox\"><b>COMPORTAMIENTO</b><p>${esc(s.behavior)}</p></div></div><div class=\"notice\">ARCHIVO DE FICCIÓN. Los datos se basan en las referencias disponibles; los campos inciertos deben confirmarse.</div>`;document.getElementById('modal').classList.remove('hidden')}\ndocument.getElementById('speciesGrid').innerHTML=species.map(card).join('');\nfunction filter(){const q=document.getElementById('search').value.toLowerCase().trim(),cat=document.getElementById('categoryFilter').value;let n=0;document.querySelectorAll('.species').forEach(c=>{const ok=c.dataset.search.includes(q)&&(!cat||c.dataset.category===cat);c.classList.toggle('hidden',!ok);if(ok)n++});document.getElementById('count').textContent=n+' / '+species.length+' REGISTROS'}\ndocument.getElementById('search').addEventListener('input',filter);document.getElementById('categoryFilter').addEventListener('change',filter);document.getElementById('close').onclick=()=>document.getElementById('modal').classList.add('hidden');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.add('hidden')});\n</script><script>(function(){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#route:\"]');if(!a)return;e.preventDefault();var u=a.getAttribute('href').slice(7);var hash=u.indexOf('#');var route=hash>=0?u.slice(0,hash):u;var anchor=hash>=0?u.slice(hash+1):'';parent.postMessage({tlsRoute:route,anchor:anchor},'*');});})();<\\/script></body></html>","index.html":"<!DOCTYPE html><html l bottom:1px solid #596b46;padding-bottom:3px}\n</style></head><body><header class=\"top\"><div class=\"logo\">T.L.S.<small>THE LAST SURVIVORS // ARCHIVE OS v.4.3</small></div><nav class=\"tabs\"><a class=\"navlink active\" href=\"#route:index.html\">ARCHIVO</a><a class=\"navlink \" href=\"#route:especies.html\">ESPECIES</a><a class=\"navlink \" href=\"#route:mutaciones.html\">MUTACIONES</a><a class=\"navlink \" href=\"#route:ecosistema.html\">ECOSISTEMA</a><a class=\"navlink \" href=\"#route:punto-0.html\">PUNTO 0</a><a class=\"navlink \" href=\"#route:medicinales.html\">MEDICINALES</a><a class=\"navlink \" href=\"#route:registros.html\">REGISTROS</a></nav><div class=\"status\">● SISTEMA LOCAL ACTIVO<br>ACCESO: INVESTIGADOR</div></header>\n<div class=\"layout\"><aside><div class=\"sidehead\">▾ T.L.S. / DIRECTORIOS</div><div class=\"sidegrid\">\n<a class=\"sidebtn active\" href=\"#route:index.html\">▸ 00_GENERAL</a>\n<a class=\"sidebtn \" href=\"#route:especies.html\">▸ 01_PHYTOGENESIS</a>\n<a class=\"sidebtn \" href=\"#route:mutaciones.html\">　PG-01_Mutaciones</a>\n<a class=\"sidebtn \" href=\"#route:ecosistema.html\">　PG-01_Ecosistemas</a>\n<a class=\"sidebtn \" href=\"#route:punto-0.html\">　PG-01_Punto_0</a>\n<a class=\"sidebtn \" href=\"#route:medicinales.html\">　PG-01_Medicinales</a>\n<a class=\"sidebtn \" href=\"#route:registros.html\">　PG-01_Testimonios</a></div>\n<div class=\"danger\">☣ NIVEL DE AMENAZA<br><strong>VARIABLE · ALTO EN ZONAS ACTIVAS</strong></div><div class=\"sidehead\">ESTADO DEL SISTEMA</div><p style=\"font-size:11px;color:#9fbd77\">● Índice local cargado<br>● Enlaces entre páginas activos<br><span style=\"color:#b3a16f\">△ Archivo conceptual de ficción</span></p></aside>\n<main class=\"main\"><div class=\"breadcrumb\">T.L.S. / ARCHIVO CENTRAL / ARCHIVO CENTRAL</div><section><div class=\"hero\"><div class=\"eyebrow\">ARCHIVO BIOLÓGICO CLASIFICADO // PG-01</div><h1>PHYTOGENESIS</h1><div class=\"stamp\">CONFIDENCIAL · NIVEL 3</div><p>Agente biológico vegetal adaptativo. La infección transforma organismos y ecosistemas mediante esporas, semillas, raíces y estructuras especializadas. Este archivo reúne referencias de campo conocidas; el comportamiento depende de la especie y del entorno.</p></div>\n<div class=\"metrics\"><div class=\"metric\"><span>EXPEDIENTE PRINCIPAL</span><strong>PG-01</strong></div><div class=\"metric\"><span>ESPECIES INDEXADAS</span><strong>30</strong></div><div class=\"metric\"><span>ANOMALÍAS EXCEPCIONALES</span><strong>05</strong></div><div class=\"metric\"><span>PUNTO DE ORIGEN</span><strong>0</strong></div></div>\n<div class=\"sectionhead\"><h2>DIRECTORIOS PRIORITARIOS</h2><span class=\"eyebrow\">SELECCIONE UN EXPEDIENTE</span></div><div class=\"grid\">\n<article class=\"card\"><div class=\"tag\">01 / CLASIFICACIÓN</div><h3>Catálogo de especies</h3><p>Fichas ampliadas con función, hábitat, dimensiones, ciclos y debilidades conocidas.</p><a class=\"backlink\" href=\"#route:especies.html\">ABRIR CATÁLOGO ↗</a></article>\n<article class=\"card\"><div class=\"tag\">02 / EXCEPCIONES</div><h3>Mutaciones raras</h3><p>Anomalías extremadamente infrecuentes, separadas de las especies comunes.</p><a class=\"backlink\" href=\"#route:mutaciones.html\">ABRIR EXPEDIENTES ↗</a></article>\n<article class=\"card\"><div class=\"tag\">03 / CARTOGRAFÍA</div><h3>Punto 0 y hábitats</h3><p>Invernadero original, cinturones ecológicos y zonas de proliferación.</p><a class=\"backlink\" href=\"#route:punto-0.html\">EXAMINAR ZONA ↗</a></article>\n<article class=\"card\"><div class=\"tag\">04 / RECURSOS</div><h3>Plantas medicinales</h3><p>Especies útiles, preparación ficticia y falsas imitadoras peligrosas.</p><a class=\"backlink\" href=\"#route:medicinales.html\">CONSULTAR REGISTRO ↗</a></article>\n<article class=\"card\"><div class=\"tag\">05 / EVIDENCIAS</div><h3>Registros recuperados</h3><p>Bitácoras, observaciones de campo y testimonios por incorporar.</p><a class=\"backlink\" href=\"#route:registros.html\" ón intensa. Las esporas pueden irritar vías respiratorias y mucosas.',height:'10–40 m',habitat:'Bosques húmedos y zonas pantanosas.',risk:'Muy alto',traits:'Savia roja muy pigmentada; niebla de esporas abrasivas; corteza con costras cristalinas.',weak:'La propagación depende de las condiciones ambientales; no se debe asumir que la niebla sea visible en toda circunstancia.'},\n{name:'El Cerebro Verde',subtitle:'La red viviente',desc:'Núcleo central masivo de raíces, tallos y tejido vegetal entrelazado que conecta múltiples plantas infectadas.',height:'20–60 m de diámetro',habitat:'Bosques densos, valles y zonas de alta concentración vegetal.',risk:'Alto',traits:'Núcleo central enorme; conexión con otras plantas; distribución de agua, nutrientes y señales químicas.',weak:'Si el núcleo es destruido, la red puede perder coordinación.'},\n{name:'La Piedra Viva',subtitle:'El depredador oculto',desc:'Mineraliza progresivamente su corteza y forma estructuras semejantes a roca; una cavidad interior puede abrirse al detectar movimiento.',height:'10–50 m',habitat:'Zonas rocosas, montañas y bosques.',risk:'Muy alto',traits:'Corteza mineralizada; apariencia de formación rocosa; cavidades depredadoras; gran resistencia física.',weak:'Su estructura mineralizada dificulta el daño; los detalles de vulnerabilidad son limitados en el registro.'},\n{name:'La Floración Absoluta',subtitle:'El evento supremo',desc:'Acumula recursos durante años para producir una floración masiva que libera polen y semillas y puede transformar el ecosistema circundante.',height:'50–200 m',habitat:'Zonas con recursos abundantes.',risk:'Alto durante la floración',traits:'Floración simultánea de múltiples estructuras; producción masiva de polen y semillas; cambio drástico del paisaje.',weak:'Después de la floración puede entrar en agotamiento y tardar décadas o siglos en repetir el evento.'}\n];\n\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\ndocument.getElementById('mutationGrid').innerHTML=mutations.map(m=>`<article class=\"card\"><div class=\"tag\" style=\"color:var(--red)\">ANOMALÍA / EXCEPCIONAL</div><h3>${esc(m.name)}</h3><p><b>${esc(m.subtitle)}.</b> ${esc(m.desc)}</p><span class=\"pill high\">RIESGO: ${esc(m.risk)}</span><br><button onclick=\"showMutation('${esc(m.name)}')\">ABRIR EXPEDIENTE ↗</button></article>`).join('');\nfunction showMutation(name){const m=mutations.find(x=>x.name===name);if(!m)return;document.getElementById('modalContent').innerHTML=`<div class=\"eyebrow\">T.L.S. / ANOMALÍA EXCEPCIONAL</div><h2>${esc(m.name)}</h2><h3>${esc(m.subtitle)}</h3><p>${esc(m.desc)}</p><div class=\"specgrid\"><div class=\"specbox\"><b>DIMENSIONES</b><p>${esc(m.height)}</p></div><div class=\"specbox\"><b>RIESGO</b><p>${esc(m.risk)}</p></div><div class=\"specbox\"><b>HÁBITAT</b><p>${esc(m.habitat)}</p></div><div class=\"specbox\"><b>CARACTERÍSTICAS</b><p>${esc(m.traits)}</p></div><div class=\"specbox\"><b>LIMITACIONES</b><p>${esc(m.weak)}</p></div></div><div class=\"notice\">Estas anomalías son extremadamente raras y no representan especies comunes.</div>`;document.getElementById('modal').classList.remove('hidden')}\ndocument.getElementById('close').onclick=()=>document.getElementById('modal').classList.add('hidden');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.add('hidden')});\n</script><script>(function(){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#route:\"]');if(!a)return;e.preventDefault();var u=a.getAttribute('href').slice(7);var hash=u.indexOf('#');var route=hash>=0?u.slice(0,hash):u;var anchor=hash>=0?u.slice(hash+1):'';parent.postMessage({tlsRoute:route,anchor:anchor},'*');});})();<\\/script></body></html>","punto-0-completo/01_Acceso_principal/expediente.htm splay:flex;justify-content:space-between;gap:8px;align-items:center}\n.dossier-code{font:10px ui-monospace,monospace;color:#7f8d73}\n@media(max-width:760px){.dossier-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.dossier-tab{width:100%}.subpanel{min-height:0}}\n\n.specimen-registry{margin-top:22px;border-top:1px solid #34402e;padding-top:16px}\n.specimen-tools{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:12px 0}\n.specimen-tools input,.specimen-tools select{min-width:0;width:100%;background:#0a0e0a;border:1px solid #35442f;color:#dce5d1;border-radius:5px;padding:10px;font-size:12px}\n.sample-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n.sample-card{display:block;text-align:left;border:1px solid #34402e;border-radius:6px;padding:12px;background:linear-gradient(145deg,#151b13,#0a0d0a);color:#e0e4d6;cursor:pointer;min-width:0}\n.sample-card:hover,.sample-card:focus-visible{border-color:#b5d77b;outline:none;box-shadow:0 0 0 2px #b5d77b22}\n.sample-card .sample-code{font:10px ui-monospace,monospace;color:#9ca98b;letter-spacing:.08em}\n.sample-card strong{display:block;font:15px Georgia,serif;margin:7px 0 5px;color:#e5d8ba}\n.sample-card p{font-size:12px;line-height:1.45;color:#aeb8a2;margin:0 0 9px}\n.sample-label{display:inline-block;font:9px ui-monospace,monospace;letter-spacing:.05em;padding:4px 6px;border:1px solid #7e633e;color:#dfbf88;border-radius:3px}\n.sample-label.canon{border-color:#70894e;color:#b5d77b}\n.sample-detail{margin-top:10px;border:1px solid #3d4a35;border-left:3px solid #b5d77b;background:#0d120d;padding:14px;border-radius:4px}\n.sample-detail h3{font:16px Georgia,serif;color:#e4d6b7;margin:0 0 8px}\n.sample-detail p,.sample-detail li{font-size:12px;line-height:1.55;color:#c1c8b8}\n.sample-detail ul{padding-left:18px}\n.sample-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}\n.sample-meta div{padding:8px;background:#151b13;border:1px solid #293327}\n.sample-meta small{display:block;font:9px ui-monospace,monospace;color:#8f9b81;margin-bottom:4px}\n.sample-meta span{font-size:12px;color:#d7ddce}\n.sample-warning{font-size:11px;color:#e0bd82;border-left:2px solid #9a7042;padding:6px 9px;margin-top:10px;background:#21190f}\n.sample-empty{padding:15px;color:#aeb8a2;font-size:12px;border:1px dashed #384532;border-radius:5px}\n@media(max-width:600px){.specimen-tools,.sample-grid,.sample-meta{grid-template-columns:1fr}}\n\n.species-index{margin-top:24px;border-top:1px solid #34402e;padding-top:16px}\n\n.environment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}\n.environment-cell{background:#151b13;border:1px solid #293327;padding:9px;border-radius:4px;min-width:0}\n.environment-cell small{display:block;font:9px ui-monospace,monospace;letter-spacing:.08em;color:#b5d77b;margin-bottom:5px}\n.environment-cell p{font-size:12px;line-height:1.45;color:#c1c8b8;margin:0}\n@media(max-width:600px){.environment-grid{grid-template-columns:1fr}}\n</style></head>\n<body>\n<header class=\"top\"><div><div class=\"brand\">T.L.S. // ARCHIVO DE CAMPO</div><div class=\"tag\">THE LAST SURVIVORS · BIOLOGICAL HAZARD DIVISION</div></div><div class=\"tag\">DOSSIER PG-01 / MAPA DE RECONOCIMIENTO</div></header>\n<div style=\"padding:10px clamp(16px,4vw,48px);background:#0b100b;border-bottom:1px solid #34422e;font:12px ui-monospace,monospace\"><a href=\"#route:index.html\" style=\"color:#b5d77b;text-decoration:none;border:1px solid #34422e;padding:8px 11px;display:inline-block\">← VOLVER A PUNTO 00 · ANILLOS</a> <span style=\"color:#9aa28e;margin-left:10px\">PUNTO 0 // MÓDULO INTEGRADO</span></div>\n\n<main><div class=\"eyebrow\">ARCHIVO 07 — CARTOGRAFÍA BIOLÓGICA</div><h1>PUNTO <span>0</span><br>Zona de origen</h1><p class=\"intro\">Archivo de reconocimiento del antiguo invernadero y del ecosistema que lo ha reclamado. Selecciona un sector para abrir su expediente: resumen, observaciones, ambiente, estructura, ecología, riesgos, incógnitas y archivo.</p>\n<div class=\"warning\"><strong>⚠ AVISO DE CLASIFICACIÓN:</strong> el invernadero invadido y su ecosistema húmedo corresponden al lore establecido. Los sectores concretos, sus nombres operativos y sus indicadores de riesgo en este mapa son una <b>propuesta de organización</b>, no distancias ni coordenadas canónicas.</div>\n<div class=\"legend\"><span class=\"pill canon\">● CANON ESTABLECIDO</span><span class=\"pill proposed\">◇ PROPUESTA DE MAPA</span><span class=\"pill\">NO A ESCALA</span><span class=\"pill proposed\">EXPEDIENTES AMPLIADOS · v0.2</span></div>\n<div class=\"layout\"><section class=\"mapbox\"><div class=\"maphead\"><span>FIG. P0-A / VISTA RADIAL</span><span>ESTADO: PARCIAL</span></div><div class=\"map\"><div class=\"compass\">N ↑</div><div class=\"rings\"><span class=\"ringlabel r1\">ANILLO EXTERIOR</span><span class=\"ringlabel r2\">BORDE VEGETAL</span><span class=\"ringlabel r3\">ZONA HÚMEDA</span><span class=\"ringlabel r4\">NÚCLEO</span>\n<button class=\"zone zcore\" data-zone=\"core\">PUNTO 0<small>INVERNADERO ANTIGUO</small></button>\n<button class=\"zone z1\" data-zone=\"canopy\">CUBIERTA INVADIDA<small>PROPUESTA · P-01</small></button>\n<button class=\"zone z2\" data-zone=\"thicket\">MATORRAL DENSO<small>PROPUESTA · P-02</small></button>\n<button class=\"zone z3\" data-zone=\"wetland\">DEPRESIÓN HÚMEDA<small>PROPUESTA · P-03</small></button>\n<button class=\"zone z4\" data-zone=\"outer\">PERÍMETRO EXTERIOR<small>PROPUESTA · P-04</small></button>\n<button class=\"zone z5\" data-zone=\"unknown\">SECTOR SIN DATOS<small>PROPUESTA · P-05</small></button>\n</div><div class=\"scale\">ESQUEMA TÁCTICO / NO A ESCALA</div></div></section>\n<aside class=\"detail\" aria-live=\"polite\"><div class=\"status\" id=\"status\">● DOSSIER BASE · CANON</div><h2 id=\"title\">Punto 0 — Invernadero</h2><p id=\"desc\">Antiguo invernadero cuya silueta original aún se conserva, aunque las plantas trepadoras han cubierto gran parte de la estructura. El interior mantiene condiciones húmedas y relativamente estables, con especies exóticas y numerosos organismos que no son necesariamente hostiles.</p><div class=\"data\"><div><label>CONDICIÓN</label><strong id=\"condition\">Humedad estable</strong></div><div><label>RIESGO</label><strong id=\"risk\">Variable / sin nivel único</strong></div><div><label>OBSERVACIÓN</label><strong id=\"obs\">Actividad vegetal diversa</strong></div><div><label>ESTADO DEL DATO</label><strong id=\"certainty\">Canon establecido</strong></div></div><div class=\"note\" id=\"note\">Nota de campo: no asumir que toda forma vegetal es agresiva. La conducta depende de la especie y del entorno.</div>\n<div class=\"dossier-heading\"><span class=\"dossier-code\" id=\"dossierCode\">EXP-P0-00</span><span class=\"tag\">EXPEDIENTE DETALLADO</span></div>\n<div class=\"dossier-tabs\" role=\"tablist\" aria-label=\"Secciones del expediente\">\n<button class=\"dossier-tab\" data-tab=\"summary\" role=\"tab\" aria-selected=\"true\">RESUMEN</button>\n<button class=\"dossier-tab\" data-tab=\"observations\" role=\"tab\" aria-selected=\"false\">OBSERVACIONES</button>\n<button class=\"dossier-tab\" data-tab=\"environment\" role=\"tab\" aria-selected=\"false\">AMBIENTE</button>\n<button class=\"dossier-tab\" data-tab=\"structure\" role=\"tab\" aria-selected=\"false\">ESTRUCTURA</button>\n<button class=\"dossier-tab\" data-tab=\"ecology\" role=\"tab\" aria-selected=\"false\">ECOLOGÍA</button>\n<button class=\"dossier-tab\" data-tab=\"risks\" role=\"tab\" aria-selected=\"false\">RIESGOS</button>\n<button class=\"dossier-tab\" data-tab=\"archive\" role=\"tab\" aria-selected=\"false\">ARCHIVO</button>\n<button class=\"dossier-tab\" data-tab=\"unknowns\" role=\"tab\" aria-selected=\"false\">INCÓGNITAS</button>\n<button class=\"dossier-tab\" data-tab=\"fieldlog\" role=\"tab\" aria-selected=\"false\">REGISTRO</button>\n</div>\n<div class=\"subpanel\" id=\"subpanel\" role=\"tabpanel\" aria-live=\"polite\">\n<h3>RESUMEN OPERATIVO</h3><p>Selecciona un sector del mapa para cargar su expediente ampliado.</p>\n</div>\n<button class=\"reset\" id=\"reset\">↺ Volver al dossier base</button>\n\n<section class=\"specimen-registry\" aria-labelledby=\"specimenTitle\">\n  <div class=\"dossier-heading\" style=\"margin-top:18px\">\n    <div>\n      <div class=\"dossier-code\">TLS / P-GEN / SAMPLE-REG</div>\n      <h2 id=\"specimenTitle\" style=\"margin:5px 0 0;font:16px Georgia,serif;color:#e4d6b7\">Registro de muestras biológicas</h2>\n    </div>\n    <span class=\"tag\">MÓDULO EXPERIMENTAL</span>\n  </div>\n  <p style=\"color:#aeb8a2;font-size:12px;margin:8px 0 12px\">Catálogo de evidencias ficticias para organizar la investigación del Punto 0. Las entradas marcadas como propuesta no son hallazgos canónicos confirmados.</p>\n  <div class=\"specimen-tools\">\n    <input id=\"sampleSearch\" type=\"search\" placeholder=\"Buscar por código, nombre o estado…\" aria-label=\"Buscar muestras\" />\n    <select id=\"sampleFilter\" aria-label=\"Filtrar muestras\">\n      <option value=\"all\">Todas las entradas</option>\n      <option value=\"canon\">Canon / lore establecido</option>\n      <option value=\"proposal\">Propuestas nuevas</option>\n      <option value=\"pending\">Identificación pendiente</option>\n    </select>\n  </div>\n  <div id=\"sampleGrid\" class=\"sample-grid\" aria-live=\"polite\"></div>\n  <div id=\"sampleDetail\" class=\"sample-detail\" aria-live=\"polite\">\n    <div class=\"dossier-code\">SELECCIONA UNA ENTRADA</div>\n    <p style=\"margin:7px 0 0;color:#b9c2ae;font-size:13px\">Selecciona una tarjeta para consultar procedencia, estado de identificación y notas de archivo.</p>\n  </div>\n</section>\n</aside></div>\n\n\n<section class=\"species-index\" id=\"internalPoints\" aria-labelledby=\"internalPointsTitle\">\n <div class=\"dossier-heading\" style=\"margin-top:22px\"><div><div class=\"dossier-code\">TLS / P0 / INTERNAL-LOCATIONS</div><h2 id=\"internalPointsTitle\" style=\"margin:5px 0 0;font:20px Georgia,serif;color:#e4d6b7\">Puntos de interés del invernadero</h2></div><span class=\"tag\">PLANO INTERNO · BORRADOR</span></div>\n <p style=\"color:#aeb8a2;font-size:13px;max-width:820px\">El invernadero es el primer espacio que vamos a documentar al detalle. Estos puntos son una propuesta editorial para organizar futuras escenas, no habitaciones canónicas ya confirmadas. Selecciona una ficha para consultar su función narrativa, señales que podrían registrarse y decisiones pendientes.</p>\n <div class=\"legend\"><span class=\"pill canon\">● CONTEXTO GENERAL CANÓNICO</span><span class=\"pill proposed\">◇ UBICACIONES PROPUESTAS</span><span class=\"pill\">SIN PLANO NI MEDIDAS CONFIRMADAS</span></div>\n <div class=\"sample-grid\" id=\"poiGrid\"></div>\n <div class=\"sample-detail\" id=\"poiDetail\" aria-live=\"polite\"><div class=\"dossier-code\">EXP-P0-INT-00</div><h3>Selecciona un punto de interés</h3><p>Las fichas se completarán una por una y servirán como plantilla para las demás carpetas del archivo.</p></div>\n</section>\n\n<section class=\"species-index\" aria-labelledby=\"speciesIndexTitle\">\n  <div class=\"dossier-heading\" style=\"margin-top:22px\">\n    <div>\n      <div class=\"dossier-code\">TLS / P-GEN / ECO-INDEX</div>\n      <h2 id=\"speciesIndexTitle\" style=\"margin:5px 0 0;font:16px Georgia,serif;color:#e4d6b7\">Índice ecológico de especies</h2>\n    </div>\n    <span class=\"tag\">LORE / REFERENCIAS</span>\n  </div>\n  <p style=\"color:#aeb8a2;font-size:12px;margin:8px 0 12px\">Índice para vincular especies con el Punto 0 sin asignarles hábitats, riesgos ni capacidades que todavía no estén confirmados. Las fichas incompletas permanecen abiertas.</p>\n  <div class=\"specimen-tools\">\n    <input id=\"speciesSearch\" type=\"search\" placeholder=\"Buscar especie o código…\" aria-label=\"Buscar especies\" />\n    <select id=\"speciesFilter\" aria-label=\"Filtrar especies\">\n      <option value=\"all\">Todas las fichas</option>\n      <option value=\"referenced\">Nombres del lore</option>\n      <option value=\"pending\">Datos pendientes</option>\n    </select>\n  </div>\n  <div id=\"speciesGrid\" class=\"sample-grid\" aria-live=\"polite\"></div>\n  <div id=\"speciesDetail\" class=\"sample-detail\" aria-live=\"polite\">\n    <div class=\"dossier-code\">ECO-INDEX // SIN SELECCIÓN</div>\n    <p style=\"margin:7px 0 0;color:#b9c2ae;font-size:13px\">Selecciona una especie para ver su estado de documentación y los campos que faltan por confirmar.</p>\n  </div>\n  <div class=\"sample-warning\">PROTOCOLO DE CANON: que un nombre aparezca en el índice no confirma que la especie habite el Punto 0. La asignación de hábitat requiere revisar la ficha original o una decisión del autor.</div>\n</section>\n\n<div class=\"bottom\"><div class=\"mini\"><b>01 / LECTURA DEL MAPA</b><p>Los anillos representan sectores conceptuales para ordenar expediciones; no indican distancias, límites biológicos exactos ni rutas seguras.</p></div><div class=\"mini\"><b>02 / REGLA DE CANON</b><p>Los datos del Punto 0 se conservan como establecidos. Los sectores añadidos están señalados como propuestas para que puedas aceptarlos, modificarlos o descartarlos.</p></div><div class=\"mini\"><b>03 / PRÓXIMA EXPANSIÓN</b><p>Podemos añadir puntos de interés, muestras recuperadas, rutas de expedición y registros de equipos desaparecidos cuando definamos su contenido.</p></div></div><div class=\"footer\"><span>TLS/P-GEN/PO-07 · EXPEDIENTES v0.6 · DOSSIER AMPLIADO</span><span>EL MAPA NO SUSTITUYE UN INFORME DE CAMPO</span></div></main>\n<script>\nconst dossiers={\ncore:{status:'● DOSSIER BASE · CANON',title:'Punto 0 — Invernadero',desc:'Antiguo invernadero cuya silueta original aún se conserva, aunque las plantas trepadoras han cubierto gran parte de la estructura. El interior mantiene condiciones húmedas y relativamente estables, con especies exóticas y numerosos organismos que no son necesariamente hostiles.',condition:'Humedad estable',risk:'Variable / sin nivel único',obs:'Actividad vegetal diversa',certainty:'Canon establecido',note:'Nota de campo: no asumir que toda forma vegetal es agresiva. La conducta depende de la especie y del entorno.'},\ncanopy:{status:'◇ PROPUESTA · P-01',title:'Cubierta invadida',desc:'Sector conceptual que agrupa las partes superiores del invernadero donde las trepadoras cubren vidrio, metal y armazones. Se propone como punto de observación para registrar el estado de la estructura.',condition:'Exposición irregular',risk:'Por determinar',obs:'Trepadoras y estructuras',certainty:'Idea nueva',note:'Propuesta no canónica: puede renombrarse, dividirse o eliminarse. No se ha establecido que este sector tenga especies exclusivas.'},\nthicket:{status:'◇ PROPUESTA · P-02',title:'Matorral denso',desc:'Área hipotética del borde vegetal, útil para clasificar la vegetación que dificulta el paso y separar avistamientos de especies territoriales de los encuentros casuales.',condition:'Vegetación cerrada',risk:'Por determinar',obs:'Visibilidad reducida',certainty:'Idea nueva',note:'Propuesta de organización. No implica que toda la vegetación de este sector sea hostil ni que exista una frontera fija.'},\nwetland:{status:'◇ PROPUESTA · P-03',title:'Depresión húmeda',desc:'Sector conceptual destinado a reunir observaciones de charcas, suelo saturado, raíces expuestas y plantas adaptadas a la humedad. Sirve como categoría de archivo, no como ubicación canónica confirmada.',condition:'Muy húmeda (propuesta)',risk:'Por determinar',obs:'Agua y raíces',certainty:'Idea nueva',note:'Antes de fijar esta zona en el lore, podemos decidir si realmente existe alrededor del Punto 0 y qué especies la habitan.'},\nouter:{status:'◇ PROPUESTA · P-04',title:'Perímetro exterior',desc:'Anillo de referencia para registrar señales, senderos bloqueados y cambios en la vegetación antes de aproximarse al invernadero. No representa una línea de seguridad real.',condition:'Variable',ri amiento lento, pérdida de referencias o encuentro; cada evento se registra por separado.']],questions:['¿Hay un eje central o el interior está dividido por bancales?','¿Se puede ver de un extremo al otro?','¿Qué rutas conectan con otras áreas?']},\n{code:'INT-P0-03',folder:'03_Zona_de_cultivo_antiguo',name:'Zona de cultivo antiguo',state:'PROPUESTA DE UBICACIÓN',purpose:'Área hipotética donde podrían haber existido bancales, macetas o mesas de cultivo antes del abandono. Es una posibilidad coherente con la función de un invernadero, pero no un hecho confirmado sobre este edificio concreto.',canon:'La identidad del lugar como invernadero es canónica; la distribución de cultivo y los restos de equipamiento no están descritos.',details:[['Elementos','Bancales, recipientes, mesas, etiquetas y sistemas de riego: pendientes de aprobación.'],['Sustrato','Composición, drenaje y profundidad: desconocidos.'],['Inventario','No se asigna ninguna especie concreta a esta zona.'],['Uso narrativo','Exploración de restos, comparación de plantas y búsqueda de pistas del uso anterior.']],questions:['¿Qué se cultivaba originalmente?','¿Quedan etiquetas legibles o registros?','¿El sistema de riego sigue presente?']},\n{code:'INT-P0-04',folder:'04_Nucleo_de_vegetacion_densa',name:'Núcleo de vegetación densa',state:'PROPUESTA DE UBICACIÓN',purpose:'Sector hipotético en el que las trepadoras y otras formas vegetales dificultan la lectura del espacio. Se propone como zona de observación, no como prueba de que exista una masa vegetal especialmente agresiva.',canon:'Las trepadoras cubren gran parte de la estructura; su distribución exacta y su densidad en cada punto no están cartografiadas.',details:[['Cobertura','Densidad, altura y puntos de anclaje: por confirmar.'],['Visibilidad','Puede estudiarse como variable de escena, no como valor fijo.'],['Conducta','No inferir hostilidad por el volumen de vegetación.'],['Uso narrativo','Rodeos, observación cuidadosa, barreras físicas o hallazgos aprobados.']],questions:['¿Las trepadoras son una sola especie o varias?','¿Están vivas, latentes o en distintas fases?','¿Qué señales permiten distinguir crecimiento normal de actividad anómala?']},\n{code:'INT-P0-05',folder:'05_Zona_de_humedad_acumulada',name:'Zona de humedad acumulada',state:'PROPUESTA DE UBICACIÓN',purpose:'Punto hipotético para estudiar el efecto de la humedad del invernadero: suelo mojado, condensación o acumulación de agua solo si decidimos incorporarlos al escenario.',canon:'El interior se describe como húmedo y relativamente estable; no hay mediciones ni charcos concretos confirmados.',details:[['Agua','Origen, profundidad, limpieza y continuidad: desconocidos.'],['Ambiente','La humedad general sí es canon; niebla, condensación intensa o agua estancada son detalles por decidir.'],['Biología','No vincular agua a infección ni a una especie sin evidencia de lore.'],['Uso narrativo','Registro ambiental, huellas en el suelo y contraste entre zonas secas y húmedas.']],questions:['¿Hay una fuente de agua activa?','¿La humedad procede del clima, riego o retención del edificio?','¿El agua es permanente o estacional?']},\n{code:'INT-P0-06',folder:'06_Area_de_investigacion',name:'Área de observación / investigación',state:'PROPUESTA DE UBICACIÓN',purpose:'Espacio opcional para explicar cómo se estudiaba el entorno antes del abandono: una mesa, herramientas, recipientes o anotaciones podrían añadirse si se aprueba esa historia.',canon:'No está confirmado que el invernadero contuviera un laboratorio, personal científico ni equipamiento de investigación.',details:[['Equipamiento','Mesas, instrumentos, recipientes y electricidad: no confirmados.'],['Documentos','Notas, etiquetas y archivos solo existen si se introducen en el canon.'],['Muestras','Las tarjetas del registro actual son plantillas conceptuales, no pruebas recuperadas.'],['Uso narrativo','Revelar antecedentes mediante pistas verificables, evitando explicar todo de golpe.']],questions:['¿Quién utilizaba el invernadero antes del colapso?','¿Era científico, agrícola, privado o parte de otro proyecto?','¿Qué información debería sobrevivir al abandono?']},\n{code:'INT-P0-07',folder:'07_Limite_interior_exterior',name:'Límite entre interior y exterior',state:'PROPUESTA DE UBICACIÓN',purpose:'Franja conceptual donde cambia el entorno del invernadero al ecosistema circundante. Permite documentar diferencias ambientales sin asumir que existe una frontera limpia o fácilmente visible.',canon:'Hay un invernadero y un ecosistema que lo ha reclamado; el límite exacto y las distancias no están establecidos.',details:[['Transición','Forma, anchura y continuidad: pendientes.'],['Vegetación','La cobertura puede cruzar la estructura, pero cada patrón concreto debe definirse.'],['Orientación','No se conocen coordenadas ni distancias internas.'],['Uso narrativo','Entrada y salida, comparación de observaciones, retorno de expediciones.']],questions:['¿La vegetación cubre el exterior antes de llegar al edificio?','¿Se distingue visualmente el interior desde fuera?','¿Qué referencias permiten orientarse?']},\n{code:'INT-P0-08',folder:'08_Sector_cerrado_sin_explorar',name:'Sector cerrado / sin explorar',state:'PROPUESTA DE UBICACIÓN',purpose:'Ficha deliberadamente abierta para cualquier parte del invernadero que todavía no se haya definido. No afirma que exista una habitación secreta ni un área peligrosa; protege el espacio para futuras decisiones del autor.',canon:'La distribución interior es desconocida en este dossier.',details:[['Existencia','El área concreta no se considera confirmada.'],['Acceso','No dibujado ni descrito.'],['Hallazgos','Ninguno registrado.'],['Uso narrativo','Reservar un hueco para descubrimientos posteriores sin fijar prematuramente su contenido.']],questions:['¿Queremos mantener un sector desconocido?','¿Se revelará por exploración, documento o testimonio?','¿Qué información conviene guardar para más adelante?']}\n];\nfunction drawPointsOfInterest(){\n const grid=document.getElementById('poiGrid'); if(!grid)return;\n grid.innerHTML=pointsOfInterest.map(p=>'<button class=\"sample-card\" data-poi=\"'+p.code+'\"><span class=\"sample-code\">'+p.code+'</span><strong>'+p.name+'</strong><p>'+p.purpose+'</p><span class=\"sample-label\">'+p.state+'</span></button>').join('');\n grid.querySelectorAll('[data-poi]').forEach(b=>b.addEventListener('click',()=>showPointOfInterest(b.dataset.poi)));\n}\nfunction showPointOfInterest(code){\n const p=pointsOfInterest.find(x=>x.code===code);if(!p)return;const box=document.getElementById('poiDetail');\n box.innerHTML='<div class=\"dossier-code\">'+p.code+' // '+p.state+'</div><h3>'+p.name+'</h3><p>'+p.purpose+'</p><h3 style=\"margin-top:14px\">RELACIÓN CON EL CANON</h3><p>'+p.canon+'</p><div class=\"environment-grid\">'+p.details.map(r=>'<div class=\"environment-cell\"><small>'+r[0]+'</small><p>'+r[1]+'</p></div>').join('')+'</div><h3 style=\"margin-top:14px\">PREGUNTAS PARA COMPLETAR LA FICHA</h3><ul>'+p.questions.map(q=>'<li>'+q+'</li>').join('')+'</ul><p style=\"margin-top:14px\"><a class=\"reset\" style=\"display:inline-block;text-decoration:none\" href=\"./'+p.folder+'/expediente.html\">ABRIR EXPEDIENTE HTML ↗</a></p><div class=\"sample-warning\">ESTADO DOCUMENTAL: PROPUESTA DE ORGANIZACIÓN. Ningún detalle de esta ubicación pasa a canon sin aprobación expresa.</div>';\n box.scrollIntoView({behavior:'smooth',block:'nearest'});\n}\ndrawPointsOfInterest();\n\n</script><script>(function(){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#route:\"]');if(!a)return;e.preventDefault();var u=a.getAttribute('href').slice(7);var hash=u.indexOf('#');var route=hash>=0?u.slice(0,hash):u;var anchor=hash>=0?u.slice(hash+1):'';parent.postMessage({tlsRoute:route,anchor:anchor},'*');});})();<\\/script></body></html>\n","punto-0.html":"<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,ini esarrollo de numerosas especies; muchas no son hostiles.</p></div><div class=\"two\" style=\"margin-top:12px\"><div class=\"panel\"><h3>Distribución por cinturones</h3><ol class=\"list\"><li><b>Interior:</b> antiguo invernadero y especies exóticas.</li><li><b>Cinturón intermedio:</b> mezcla de especies, vegetación mixta y fauna.</li><li><b>Cinturón exterior:</b> plantas adultas y colonias más extensas.</li><li><b>Zonas territoriales:</b> grupos separados con comportamientos propios.</li><li><b>Zonas hostiles dormidas:</b> plantas que no permanecen activas continuamente.</li></ol></div><div class=\"panel\"><h3>Observación de campo</h3><div class=\"log\"><b>REGISTRO 00-A</b><br>La forma del invernadero sigue siendo reconocible desde el exterior.</div><div class=\"log\"><b>REGISTRO 00-B</b><br>La vegetación no presenta un comportamiento uniforme.</div><div class=\"log\"><b>REGISTRO 00-C</b><br>La fauna local incluye dispersores de semillas, polinizadores y especies adaptadas.</div></div></div><div class=\"panel\" style=\"margin-top:14px;border-color:#718c4d;background:linear-gradient(145deg,#182016,#0e110f)\"><div style=\"color:#9ab86a;font-size:10px;letter-spacing:2px\">MÓDULO AMPLIADO DISPONIBLE</div><h3 style=\"margin:8px 0;color:#e8dfc9\">PUNTO 0 // EXPEDIENTES INTERNOS</h3><p style=\"color:#c4c0ae\">Accede al mapa ecológico, los ocho sectores internos, los expedientes HTML y Markdown, los puntos de interés y las notas de exploración. Este módulo amplía la página general sin sustituirla.</p><a class=\"navlink active\" style=\"display:inline-block;margin-top:4px\" href=\"#route:punto-0-completo/index.html\">ABRIR ARCHIVO COMPLETO DE PUNTO 0 ↗</a></div>\n<a class=\"backlink\" href=\"#route:ecosistema.html\">← VOLVER A ECOSISTEMAS</a>\n<div class=\"footer\">T.L.S. // THE LAST SURVIVORS · PHYTOGENESIS PG-01<br>BUILD 0.4 · SITIO HTML MULTIPÁGINA · ARCHIVO DE FICCIÓN</div></main></div>\n<script>(function(){document.addEventListener('click',function(e){var a=e.target.clos
